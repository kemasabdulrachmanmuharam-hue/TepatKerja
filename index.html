<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EA580C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TepatKerja" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>TepatKerja — Pengingat Waktu Masuk Kerja &amp; Hitung Mundur Berangkat</title>
    <meta
      name="description"
      content="Aplikasi pengingat waktu masuk kerja dengan hitung mundur jam berangkat, jadwal tetap harian, sistem shift fleksibel, alarm suara, dan notifikasi browser bertahap."
    />
    <meta property="og:title" content="TepatKerja — Pengingat Waktu Masuk Kerja" />
    <meta
      property="og:description"
      content="Atur jadwal kerja tetap atau shift fleksibel, hitung mundur waktu berangkat, dan aktifkan pengingat bertahap langsung di browser."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Orbitron:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var rawTheme = localStorage.getItem('tepatkerja_theme_v1');
          var rawExtras = localStorage.getItem('tepatkerja_extras_v1');
          var theme = rawTheme ? JSON.parse(rawTheme) : {};
          var extras = rawExtras ? JSON.parse(rawExtras) : {};
          var scheduleMode =
            extras && (extras.themeScheduleMode === 'manual' || extras.themeScheduleMode === 'system')
              ? extras.themeScheduleMode
              : 'auto';

          var resolvedMode = 'light';
          if (scheduleMode === 'manual') {
            resolvedMode = theme && theme.colorMode === 'dark' ? 'dark' : 'light';
          } else if (scheduleMode === 'system') {
            resolvedMode =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          } else {
            var startHr =
              typeof extras.nightStartHour === 'number'
                ? Math.max(16, Math.min(23, Math.round(extras.nightStartHour)))
                : 18;
            var endHr =
              typeof extras.nightEndHour === 'number'
                ? Math.max(4, Math.min(9, Math.round(extras.nightEndHour)))
                : 6;
            var hr = new Date().getHours();
            var isNight =
              startHr > endHr
                ? hr >= startHr || hr < endHr
                : hr >= startHr && hr < endHr;
            resolvedMode = isNight ? 'dark' : 'light';
          }

          if (resolvedMode === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          document.documentElement.dataset.theme =
            theme && theme.presetId ? theme.presetId : 'karbon';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-orange-200 selection:text-orange-950 dark:selection:bg-orange-900 dark:selection:text-orange-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
